name: Build Android APKs

# Builds two installable test APKs (customer app and partner app) with Capacitor.
# Download them from the run's "Artifacts" section on GitHub (Actions tab).
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: customer
            appId: in.lastpick.app
            appName: LastPick
          - variant: owner
            appId: in.lastpick.partner
            appName: LastPick Business
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web app (${{ matrix.variant }})
        env:
          VITE_APP_VARIANT: ${{ matrix.variant }}
          VITE_API_URL: ${{ vars[format('API_URL_{0}', matrix.variant)] }}
        # No server address set yet (AWS not created) -> demo mode with the test accounts.
        run: |
          if [ -z "$VITE_API_URL" ]; then export VITE_DEMO=1; echo "Demo mode APK"; fi
          npx vite build --outDir dist-app --base ./

      - name: Create Android project
        run: |
          cat > capacitor.config.json <<EOF
          { "appId": "${{ matrix.appId }}", "appName": "${{ matrix.appName }}", "webDir": "dist-app",
            "server": { "androidScheme": "https" } }
          EOF
          npx cap add android
          if [ -d android-assets/${{ matrix.variant }}/res ]; then cp -r android-assets/${{ matrix.variant }}/res/* android/app/src/main/res/; fi
          npx cap sync android

      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: lastpick-${{ matrix.variant }}-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
