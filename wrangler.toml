# LastPick web apps on Cloudflare (free plan): static files only, no server code here.
# The API runs on Supabase Edge Functions (supabase/functions). Deployed by .github/workflows/supabase.yml.
name = "lastpick-web"
compatibility_date = "2025-09-01"
workers_dev = false

[env.customer]
name = "lastpick-web-customer"
routes = [{ pattern = "customer.lastpick.in", custom_domain = true }]
assets = { directory = "web/dist-customer", not_found_handling = "single-page-application" }

[env.partner]
name = "lastpick-web-partner"
routes = [{ pattern = "partner.lastpick.in", custom_domain = true }]
assets = { directory = "web/dist-partner", not_found_handling = "single-page-application" }

[env.admin]
name = "lastpick-web-admin"
routes = [{ pattern = "admin.lastpick.in", custom_domain = true }]
assets = { directory = "web/dist-admin", not_found_handling = "single-page-application" }

[env.support]
name = "lastpick-web-support"
routes = [{ pattern = "support.lastpick.in", custom_domain = true }]
assets = { directory = "web/dist-support", not_found_handling = "single-page-application" }
