<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06373A" />
    <meta name="description" content="LastPick: today's deals from verified shops near you. Food, salon, hotel, gym, farm-fresh and bus ticket offers. Free for customers." />
    <meta property="og:type" content="website" /><meta property="og:site_name" content="LastPick" />
    <meta property="og:title" content="LastPick – Today's best deals near you" />
    <meta property="og:description" content="Same-day offers from verified shops near you. Free for customers." />
    <meta property="og:image" content="https://lastpick.in/og.png" /><meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="lp-manifest" rel="manifest" href="/manifest.webmanifest" />
    <link id="lp-apple" rel="apple-touch-icon" href="/apple-touch-customer.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta id="lp-apple-title" name="apple-mobile-web-app-title" content="LastPick" />
    <script>
      // partner.lastpick.in installs as "LastPick Partner" with the gold icon; the customer site keeps the teal one
      if (location.hostname.indexOf("partner.") === 0) {
        document.getElementById("lp-manifest").href = "/manifest-partner.webmanifest";
        document.getElementById("lp-apple").href = "/apple-touch-partner.png";
        document.getElementById("lp-apple-title").content = "LP Partner";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>LastPick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
