<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick help and support</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A1D8F}a:hover{color:#24105E}
@keyframes lpIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1530">
  <div style="background: {{brand}}; color: #FFFFFF; padding: 16px 16px 70px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Account.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.14); color: #FFFFFF; display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 800">Help &amp; support</span><span style="font-size: 12px; opacity: .85">We're here 9 AM – 9 PM, all days</span></div>
    </div>
  </div>

  <div style="margin: -56px 14px 0; background: #FFFFFF; border-radius: 18px; padding: 14px 10px; box-shadow: 0 6px 20px rgba(36,16,94,.12); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{ways}}" as="w" hint-placeholder-count="4">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #1A1530">
        <span style="width: 48px; height: 48px; border-radius: 14px; background: {{w.tint}}; color: {{w.ink}}; display: grid; place-items: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg>
        </span>
        <span style="font-size: 11.5px; font-weight: 600; text-align: center">{{w.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="margin: 14px 14px 0; display: flex; gap: 8px; overflow: hidden">
    <sc-for list="{{faqs}}" as="f" hint-placeholder-count="3">
      <span style="flex: none; height: 34px; padding: 0 12px; border-radius: 17px; background: #FFFFFF; border: 1px solid #DAD5E6; display: flex; align-items: center; font-size: 12px; font-weight: 700">{{f}}</span>
    </sc-for>
  </div>

  <div style="margin: 14px 14px 0; background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 14px; font-weight: 800">Using the app</span>
      <span style="font-size: 11px; font-weight: 800; color: #0F6E3C; background: #E3F4EA; padding: 3px 8px; border-radius: 8px">REPLIED</span>
    </div>
    <sc-for list="{{chat}}" as="m" hint-placeholder-count="3">
      <div style="align-self: {{m.side}}; max-width: 78%; background: {{m.bg}}; color: {{m.fg}}; border-radius: 16px; padding: 9px 12px; animation: lpIn .4s ease both; animation-delay: {{m.d}}">
        <div style="font-size: 10.5px; font-weight: 700; opacity: .75">{{m.who}}</div>
        <div style="font-size: 13px; line-height: 1.4">{{m.text}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E6E2F0; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex: 1; height: 46px; border-radius: 14px; border: 1px solid #DAD5E6; display: flex; align-items: center; padding: 0 12px">
        <input aria-label="Message to support" placeholder="Type your message" style="border: 0; outline: 0; flex: 1; font: inherit; font-size: 14px; background: transparent">
      </label>
      <button aria-label="Send" style="width: 46px; height: 46px; border-radius: 14px; border: 0; background: {{brand}}; color: #FFFFFF; display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"></path></svg>
      </button>
    </div>
    <span style="font-size: 11px; color: #5F5A73; text-align: center">Formal complaint? <a href="#">Raise a ticket</a> · <a href="#">How LastPick works &amp; rules</a></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3A1D8F","options":["#3A1D8F","#0B5CAD","#0F6E5C","#7A1E4B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const brand = this.props.brand ?? '#3A1D8F';
    const me = (text, d) => ({ who: 'You', text, side: 'flex-end', bg: brand, fg: '#FFFFFF', d });
    const team = (text, d) => ({ who: 'LastPick support', text, side: 'flex-start', bg: '#F3F1F9', fg: '#1A1530', d });
    return {
      brand,
      ways: [
        { label: 'Chat', tint: '#ECE7FA', ink: '#3A1D8F', icon: 'M4 20l1.5-4A8 8 0 1 1 9 19.5z' },
        { label: 'WhatsApp', tint: '#E3F4EA', ink: '#0F7A43', icon: 'M4 20l1.5-4A8 8 0 1 1 9 19.5zM9 10c.5 2 2 3.5 4 4' },
        { label: 'Call us', tint: '#E9EEFF', ink: '#1E4BB8', icon: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2' },
        { label: 'E-mail', tint: '#FFF1E0', ink: '#B35A00', icon: 'M3 6h18v12H3zM3 7l9 6 9-6' },
      ],
      faqs: ['How it works', 'Not honoured?', 'Is my number safe?', 'Logged out?'],
      chat: [
        me('How do I share my number with a business?', '.1s'),
        team('Open the offer and tap "Share my number". You will see exactly who gets it before it is sent.', '.35s'),
        me('Got it, thanks!', '.6s'),
      ],
    };
  }
}
</script>
</body>
</html>
