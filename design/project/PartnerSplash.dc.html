<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick Business opening animation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFF1BF}
@keyframes lpPulse{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@keyframes lpFloatIn{0%{opacity:0;transform:translateX(var(--from,0)) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
@keyframes lpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes lpPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes lpRise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes lpLoad{0%{width:0}100%{width:100%}}
@keyframes lpCount{0%{opacity:0}100%{opacity:1}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #071D3A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 34%, #0B5CAD 0%, #071D3A 64%)"></div>

  <div style="position: absolute; top: 22px; left: 20px; display: flex; align-items: center; gap: 10px; animation: lpRise .6s ease both">
    <span style="width: 38px; height: 38px; border-radius: 12px; background: {{accent}}; color: #071D3A; display: grid; place-items: center; font-weight: 800; font-size: 20px">L</span>
    <span style="display: flex; flex-direction: column"><b style="font-size: 18px">LastPick</b><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.4px; opacity: .8">BUSINESS</span></span>
  </div>

  <sc-for list="{{rings}}" as="r" hint-placeholder-count="3">
    <span style="position: absolute; left: 50%; top: 290px; width: 460px; height: 460px; border-radius: 50%; border: 2px solid rgba(255,194,26,.5); animation: lpPulse 3.6s ease-out infinite; animation-delay: {{r.delay}}"></span>
  </sc-for>
  <span style="position: absolute; left: 50%; top: 290px; width: 92px; height: 92px; border-radius: 26px; background: #FFFFFF; color: #0B5CAD; display: grid; place-items: center; box-shadow: 0 12px 30px rgba(0,0,0,.35); animation: lpPop .8s cubic-bezier(.2,.9,.3,1.2) both">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6"></path></svg>
  </span>

  <sc-for list="{{pings}}" as="p" hint-placeholder-count="5">
    <div style="position: absolute; left: {{p.x}}; top: {{p.y}}; animation: lpFloatIn .7s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: {{p.delay}}; --from: {{p.from}}">
      <div style="width: 172px; background: #FFFFFF; color: #121A2B; border-radius: 14px; padding: 9px 10px; box-shadow: 0 10px 26px rgba(0,0,0,.35); display: flex; gap: 9px; align-items: center; animation: lpBob 4s ease-in-out infinite; animation-delay: {{p.bob}}">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: {{p.tint}}; color: {{p.ink}}; display: grid; place-items: center; flex: none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><b style="font-size: 12px; line-height: 1.25">{{p.title}}</b><span style="font-size: 10.5px; color: #55607A">{{p.sub}}</span></span>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; animation: lpRise .6s ease both; animation-delay: 1.5s">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column">
          <b style="font-size: 18px; color: {{accent}}">{{s.value}}</b><span style="font-size: 10.5px; color: #CFE0F5">{{s.label}}</span>
        </div>
      </sc-for>
    </div>
    <h1 style="margin: 0; font-size: 30px; line-height: 1.14; font-weight: 800; animation: lpRise .6s ease both; animation-delay: 1.65s">Customers near you<br>are looking right now.</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #CFE0F5; animation: lpRise .6s ease both; animation-delay: 1.8s">Post an offer, empty movie seats, a health camp, a trip with free seats or a clearance sale in under a minute. Customers call you directly. No commission.</p>
    <div style="display: flex; gap: 10px; animation: lpRise .6s ease both; animation-delay: 1.95s">
      <a href="PartnerHome.dc.html" style="flex: 1.3; height: 52px; border-radius: 14px; background: {{accent}}; color: #071D3A; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px">
        Open my business
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="PartnerHome.dc.html" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.4); color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px">Register shop</a>
    </div>
    <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden"><div style="height: 4px; background: {{accent}}; animation: lpLoad 2.4s ease both"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFC21A","options":["#FFC21A","#FF9A1F","#21C29A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FFC21A',
      rings: [{ delay: '0s' }, { delay: '1.2s' }, { delay: '2.4s' }],
      stats: [{ value: '2,340', label: 'shoppers nearby' }, { value: '₹0', label: 'commission' }, { value: '60 s', label: 'to post' }],
      pings: [
        { x: '12px', y: '92px', from: '-40px', delay: '.5s', bob: '0s', title: 'New lead: Priya', sub: 'wants your cakes · 1.2 km', tint: '#E8F0FB', ink: '#0B5CAD', icon: 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
        { x: '206px', y: '150px', from: '40px', delay: '.75s', bob: '.7s', title: '+38 views today', sub: 'Closing-time cakes', tint: '#FFF1E0', ink: '#B35A00', icon: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
        { x: '8px', y: '262px', from: '-40px', delay: '1s', bob: '1.3s', title: '18 registered', sub: 'Free eye camp, Sunday', tint: '#E4F5F2', ink: '#0F6E5C', icon: 'M9 12l2 2 4-4M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' },
        { x: '210px', y: '300px', from: '40px', delay: '1.2s', bob: '.4s', title: '2 seats booked', sub: 'Trip to Mysuru, 6 AM', tint: '#FCE9F2', ink: '#9C1F5A', icon: 'M5 16h14v-4l-2-5H7l-2 5zM5 12h14M7.5 16v2M16.5 16v2' },
        { x: '8px', y: '410px', from: '-40px', delay: '1.4s', bob: '1.6s', title: '42 seats filled', sub: 'Tonight 6:30 PM show, ₹80', tint: '#FFE9E6', ink: '#B3261E', icon: 'M2 9V6a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6zM13 5v2M13 11v2M13 17v2' },
        { x: '206px', y: '440px', from: '40px', delay: '1.55s', bob: '1s', title: 'New review ★★★★★', sub: '"Fresh and hot, thank you!"', tint: '#FFF6D6', ink: '#8A6100', icon: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z' },
      ],
    };
  }
}
</script>
</body>
</html>
