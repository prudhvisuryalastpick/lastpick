<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick my savings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A1D8F}a:hover{color:#24105E}
@keyframes lpGrow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1530">
  <div style="background: {{brand}}; color: #FFFFFF; padding: 16px 16px 92px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Account.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.14); color: #FFFFFF; display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 17px; font-weight: 800">My savings</span>
      <span style="margin-left: auto; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.16); padding: 6px 10px; border-radius: 12px">Last 12 months</span>
    </div>
  </div>

  <div style="margin: -78px 14px 0; background: #FFFFFF; border-radius: 18px; padding: 18px; box-shadow: 0 6px 20px rgba(36,16,94,.12); display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12.5px; color: #5F5A73">You saved with local businesses</span>
    <span style="font-size: 36px; font-weight: 800; color: #0F6E3C">₹4,820</span>
    <span style="font-size: 12.5px; color: #5F5A73">₹1,240 this month · 41% off on average</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="3">
        <div style="background: #F3F1F9; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{brand}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg>
          <b style="font-size: 16px">{{k.value}}</b><span style="font-size: 10.5px; color: #5F5A73; line-height: 1.3">{{k.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 18px; padding: 16px">
    <span style="font-size: 14px; font-weight: 800">Savings by month</span>
    <div style="display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 12px">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <span style="font-size: 10px; font-weight: 700; color: #5F5A73">{{m.amt}}</span>
          <div style="width: 26px; height: {{m.h}}; border-radius: 7px; background: {{m.c}}; transform-origin: bottom; animation: lpGrow .8s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: {{m.d}}"></div>
          <span style="font-size: 11px; color: #5F5A73">{{m.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 12px 14px 0; background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 800">Where you saved</span>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: {{c.tint}}; color: {{c.ink}}; display: grid; place-items: center; flex: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
        </span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{c.label}}</span><b>{{c.amt}}</b></div>
          <div style="height: 6px; border-radius: 3px; background: #EEEAF6"><div style="height: 6px; border-radius: 3px; width: {{c.pct}}; background: {{c.ink}}"></div></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 14px 0; border-radius: 16px; background: #E3F4EA; color: #0F6E3C; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 600">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg>
    You gave ₹6,950 of business to 14 local shops. Thank you for buying local.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#3A1D8F","options":["#3A1D8F","#0B5CAD","#0F6E5C","#7A1E4B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const brand = this.props.brand ?? '#3A1D8F';
    const vals = [['Jun', 320], ['Jul', 610], ['Aug', 480], ['Sep', 900], ['Oct', 1270], ['Nov', 1240]];
    const max = 1270;
    return {
      brand,
      kpis: [
        { value: '14', label: 'Local businesses supported', icon: 'M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6' },
        { value: '₹6,950', label: 'Business you gave to locals', icon: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
        { value: '23', label: 'Deals you went for', icon: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z' },
      ],
      months: vals.map(([label, v], i) => ({ label, amt: '₹' + v.toLocaleString('en-IN'), h: Math.round((v / max) * 80) + 'px', c: i === 5 ? '#0F6E3C' : '#BFE3CC', d: (i * 0.08) + 's' })),
      cats: [
        { label: 'Food & bakery', amt: '₹1,860', pct: '100%', tint: '#FFF1E0', ink: '#B35A00', icon: 'M4 11h16v9H4zM4 15h16M8 11V8M12 11V6M16 11V8' },
        { label: 'Hotels & stays', amt: '₹1,500', pct: '80%', tint: '#E9EEFF', ink: '#1E4BB8', icon: 'M3 18V8M3 14h18v4M21 18v-4a3 3 0 0 0-3-3h-7v3' },
        { label: 'Doctors & health camps', amt: '₹900', pct: '48%', tint: '#E4F5F2', ink: '#0F6E5C', icon: 'M8 3v5a4 4 0 0 0 8 0V3M12 12v3a4 4 0 0 0 8 0v-1' },
      ],
    };
  }
}
</script>
</body>
</html>
