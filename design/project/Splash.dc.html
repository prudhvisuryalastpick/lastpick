<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick opening animation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFE2B8}
@keyframes lpPulse{0%{transform:translate(-50%,-50%) scale(.35);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@keyframes lpFloatIn{0%{opacity:0;transform:translateY(24px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes lpDrop{0%{opacity:0;transform:translate(-50%,-140%)}60%{opacity:1;transform:translate(-50%,-44%)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes lpRise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes lpLoad{0%{width:0}100%{width:100%}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1C0F4A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #FFFFFF">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 34%, #3A1D8F 0%, #1C0F4A 62%)"></div>

  <div style="position: absolute; top: 22px; left: 20px; display: flex; align-items: center; gap: 10px; animation: lpRise .6s ease both">
    <span style="width: 38px; height: 38px; border-radius: 12px; background: {{accent}}; color: #1C0F4A; display: grid; place-items: center; font-weight: 800; font-size: 20px">L</span>
    <span style="font-size: 20px; font-weight: 800">LastPick</span>
  </div>

  <sc-for list="{{rings}}" as="r" hint-placeholder-count="3">
    <span style="position: absolute; left: 50%; top: 290px; width: 460px; height: 460px; border-radius: 50%; border: 2px solid rgba(255,154,31,.55); animation: lpPulse 3.6s ease-out infinite; animation-delay: {{r.delay}}"></span>
  </sc-for>
  <span style="position: absolute; left: 50%; top: 290px; width: 84px; height: 84px; border-radius: 42px; background: rgba(255,255,255,.12); display: grid; place-items: center; animation: lpDrop .9s cubic-bezier(.2,.9,.3,1.2) both">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="{{accent}}" stroke="#1C0F4A" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.6" fill="#1C0F4A"></circle></svg>
  </span>

  <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
    <div style="position: absolute; left: {{c.x}}; top: {{c.y}}; animation: lpFloatIn .7s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: {{c.delay}}">
      <div style="width: 148px; background: #FFFFFF; color: #1A1530; border-radius: 16px; padding: 10px 11px; box-shadow: 0 10px 28px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 4px; animation: lpBob 4s ease-in-out infinite; animation-delay: {{c.bob}}">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="width: 30px; height: 30px; border-radius: 9px; background: {{c.tint}}; color: {{c.ink}}; display: grid; place-items: center">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
          </span>
          <span style="font-size: 10.5px; font-weight: 800; color: #FFFFFF; background: {{c.badgeBg}}; padding: 3px 7px; border-radius: 8px">{{c.badge}}</span>
        </div>
        <b style="font-size: 12.5px; line-height: 1.25">{{c.title}}</b>
        <span style="font-size: 10.5px; color: #5F5A73">{{c.sub}}</span>
      </div>
    </div>
  </sc-for>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: #FFD9A6; background: rgba(255,154,31,.16); border: 1px solid rgba(255,154,31,.4); padding: 6px 12px; border-radius: 16px; animation: lpRise .6s ease both; animation-delay: 1.5s">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg>
      First month free
    </span>
    <h1 style="margin: 0; font-size: 32px; line-height: 1.12; font-weight: 800; animation: lpRise .6s ease both; animation-delay: 1.65s">Your town's deals,<br>live right now.</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #D8D2EE; animation: lpRise .6s ease both; animation-delay: 1.8s">Food, rooms, halls, movie tickets, trips, doctors' camps and things locals are selling, within 30 km. Call the owner directly and keep money in your neighbourhood.</p>
    <div style="display: flex; gap: 10px; animation: lpRise .6s ease both; animation-delay: 1.95s">
      <a href="Main.dc.html" style="flex: 1.3; height: 52px; border-radius: 14px; background: {{accent}}; color: #1C0F4A; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 15px">
        Get started
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.4); color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 14px">Look around</a>
    </div>
    <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden"><div style="height: 4px; background: {{accent}}; animation: lpLoad 2.4s ease both"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF9A1F","options":["#FF9A1F","#FFC21A","#21C29A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const green = '#0F7A43', orange = '#B35A00', blue = '#1E4BB8', pink = '#9C1F5A';
    return {
      accent: this.props.accent ?? '#FF9A1F',
      rings: [{ delay: '0s' }, { delay: '1.2s' }, { delay: '2.4s' }],
      cards: [
        { x: '16px', y: '84px', delay: '.5s', bob: '0s', title: 'Room for tonight', sub: 'Ends in 5h · 3.4 km', badge: '-47%', badgeBg: green, tint: '#E9EEFF', ink: blue, icon: 'M3 18V8M3 14h18v4M21 18v-4a3 3 0 0 0-3-3h-7v3' },
        { x: '226px', y: '110px', delay: '.7s', bob: '.6s', title: 'Cakes at closing', sub: '1.2 km · 7 left', badge: '-50%', badgeBg: green, tint: '#FFF1E0', ink: orange, icon: 'M4 11h16v9H4zM4 15h16M8 11V8M12 11V6M16 11V8' },
        { x: '8px', y: '250px', delay: '.9s', bob: '1.2s', title: 'Free eye camp, Sunday', sub: 'Dr. Rao Clinic · Register', badge: 'FREE', badgeBg: blue, tint: '#E4F5F2', ink: '#0F6E5C', icon: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' },
        { x: '234px', y: '262px', delay: '1.1s', bob: '.3s', title: 'Trip to Mysuru, 6 AM', sub: '2 seats free · share fuel', badge: 'TRIP', badgeBg: orange, tint: '#FCE9F2', ink: pink, icon: 'M5 16h14v-4l-2-5H7l-2 5zM5 12h14M7.5 16v2M16.5 16v2' },
        { x: '30px', y: '408px', delay: '1.3s', bob: '.9s', title: 'Used cycle for sale', sub: 'Local seller · 900 m', badge: '₹1,500', badgeBg: '#3A1D8F', tint: '#F2ECFF', ink: '#3A1D8F', icon: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01' },
        { x: '222px', y: '420px', delay: '1.45s', bob: '1.5s', title: 'Movie tonight, 6:30 PM', sub: 'Empty seats · ₹80 tickets', badge: '-60%', badgeBg: green, tint: '#FFE9E6', ink: '#B3261E', icon: 'M2 9V6a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6zM13 5v2M13 11v2M13 17v2' },
      ],
    };
  }
}
</script>
</body>
</html>
