<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick Business leads</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5CAD}a:hover{color:#073E78}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F1F4F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #121A2B">
  <div style="background: {{brand}}; color: #FFFFFF; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 20px; font-weight: 800">Leads</span>
      <span style="font-size: 12px; font-weight: 700; background: rgba(255,255,255,.16); padding: 6px 10px; border-radius: 12px">5 new</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 4px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button style="height: 36px; border-radius: 9px; border: 0; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 13px; font-weight: 700">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{leads}}" as="l" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 44px; height: 44px; border-radius: 22px; background: {{l.tint}}; color: {{l.ink}}; display: grid; place-items: center; font-weight: 800; font-size: 15px">{{l.initials}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
            <span style="font-size: 14.5px; font-weight: 700">{{l.name}}</span>
            <span style="font-size: 12px; color: #55607A">{{l.offer}} · {{l.time}}</span>
          </div>
          <span style="font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: {{l.statusBg}}; color: {{l.statusFg}}">{{l.status}}</span>
        </div>
        <div style="display: flex; gap: 8px">
          <a href="#" style="flex: 1; height: 40px; border-radius: 12px; background: {{brand}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
            Call
          </a>
          <a href="#" style="flex: 1; height: 40px; border-radius: 12px; background: #0F7A43; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 700">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"></path></svg>
            WhatsApp
          </a>
          <button aria-label="Mark as contacted" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #D5DCE7; background: #FFFFFF; color: #0F6E3C; display: grid; place-items: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          </button>
        </div>
      </div>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #FFFFFF; border-top: 1px solid #E3E8F0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
      <sc-if value="{{n.center}}" hint-placeholder-val="{{ false }}">
        <a href="PostOffer.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #121A2B; font-size: 11px; font-weight: 700; margin-top: -26px">
          <span style="width: 56px; height: 56px; border-radius: 28px; background: {{brand}}; color: #FFFFFF; display: grid; place-items: center; border: 4px solid #FFFFFF; box-shadow: 0 6px 16px rgba(11,92,173,.35)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          </span>
          {{n.label}}
        </a>
      </sc-if>
      <sc-if value="{{n.side}}" hint-placeholder-val="{{ true }}">
        <a href="{{n.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 11px; font-weight: 600">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
          {{n.label}}
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#0B5CAD","options":["#0B5CAD","#3A1D8F","#0F6E5C","#7A1E4B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const brand = this.props.brand ?? '#0B5CAD';
    const side = (label, icon, href, on) => ({ label, icon, href, side: true, center: false, color: on ? brand : '#55607A' });
    const tab = (label, on) => ({ label, bg: on ? '#FFFFFF' : 'transparent', fg: on ? brand : '#FFFFFF' });
    const NEW = { status: 'NEW', statusBg: '#FFF1E0', statusFg: '#8A4300' };
    const DONE = { status: 'CONTACTED', statusBg: '#E3F4EA', statusFg: '#0F6E3C' };
    const leads = 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z';
    return {
      brand,
      tabs: [tab('All', true), tab('New', false), tab('Contacted', false)],
      leads: [
        { name: 'Priya S.', initials: 'PS', offer: 'Closing-time cakes', time: '6 min ago', tint: '#E8F0FB', ink: '#0B5CAD', ...NEW },
        { name: 'Rahul M.', initials: 'RM', offer: 'Closing-time cakes', time: '24 min ago', tint: '#FCE9F2', ink: '#9C1F5A', ...NEW },
        { name: 'Kavya R.', initials: 'KR', offer: 'Fresh bread basket', time: '1 h ago', tint: '#E4F5F2', ink: '#0F6E5C', ...DONE },
        { name: 'Imran K.', initials: 'IK', offer: 'Closing-time cakes', time: 'Yesterday', tint: '#F2ECFF', ink: '#3A1D8F', ...DONE },
      ],
      nav: [side('Home', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z', 'PartnerHome.dc.html', false),
        side('Leads', leads, 'Leads.dc.html', true),
        { label: 'Post', icon: 'M12 5v14M5 12h14', center: true, side: false },
        side('Offers', 'M4 4h16v16H4zM4 10h16M10 4v16', '#', false),
        side('Account', 'M20 21a8 8 0 0 0-16 0M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', '#', false)],
    };
  }
}
</script>
</body>
</html>
