<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LastPick admin dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A1D8F}a:hover{color:#24105E}
</style>
</helmet>
<div style="min-height: 900px; background: #F3F1F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1530; display: flex; flex-wrap: wrap">
  <aside style="flex: 1 1 220px; max-width: 260px; background: #1C0F4A; color: #FFFFFF; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <span style="width: 36px; height: 36px; border-radius: 11px; background: #FF9A1F; color: #1C0F4A; display: grid; place-items: center; font-weight: 800; font-size: 18px">L</span>
      <span style="display: flex; flex-direction: column"><b style="font-size: 16px">LastPick</b><span style="font-size: 10.5px; letter-spacing: 1.4px; opacity: .75; font-weight: 700">ADMIN</span></span>
    </div>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="8">
      <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; background: {{m.bg}}; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.icon}}"></path></svg>
        <span style="flex: 1">{{m.label}}</span>
        <sc-if value="{{m.count}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; background: #FF9A1F; color: #1C0F4A; padding: 2px 7px; border-radius: 9px">{{m.count}}</span></sc-if>
      </a>
    </sc-for>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 800">Overview</h1>
        <span style="font-size: 13px; color: #5F5A73">All of India · updated just now</span>
      </div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 8px; background: #E3F4EA; color: #0F6E3C; font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 12px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"></path></svg>
          Free launch mode on
        </span>
        <span style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #DAD5E6; font-size: 12.5px; font-weight: 700; padding: 8px 12px; border-radius: 12px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A1D8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          Night hours from 11 PM
        </span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
      <sc-for list="{{kpis}}" as="k" hint-placeholder-count="6">
        <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; gap: 12px; align-items: center">
          <span style="width: 44px; height: 44px; border-radius: 13px; background: {{k.tint}}; color: {{k.ink}}; display: grid; place-items: center; flex: none">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column"><b style="font-size: 22px">{{k.value}}</b><span style="font-size: 12px; color: #5F5A73">{{k.label}}</span></span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 18px">
      <section style="flex: 3 1 460px; min-width: 0; background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800">Waiting for verification</h2>
          <a href="#" style="font-size: 13px; font-weight: 700; text-decoration: none">See all 12</a>
        </div>
        <div style="overflow-x: auto">
          <div style="min-width: 520px; display: flex; flex-direction: column">
            <sc-for list="{{queue}}" as="q" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0EDF6">
                <span style="width: 40px; height: 40px; border-radius: 12px; background: {{q.tint}}; color: {{q.ink}}; display: grid; place-items: center; flex: none">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg>
                </span>
                <span style="display: flex; flex-direction: column; flex: 1; min-width: 0"><b style="font-size: 14px">{{q.name}}</b><span style="font-size: 12px; color: #5F5A73">{{q.meta}}</span></span>
                <sc-if value="{{q.flag}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; color: #8A4300; background: #FFF1E0; padding: 4px 8px; border-radius: 8px">{{q.flag}}</span></sc-if>
                <button style="height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid #DAD5E6; background: #FFFFFF; font: inherit; font-size: 12.5px; font-weight: 700; color: #B42318">Reject</button>
                <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: #3A1D8F; font: inherit; font-size: 12.5px; font-weight: 700; color: #FFFFFF">Verify</button>
              </div>
            </sc-for>
          </div>
        </div>
      </section>

      <section style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800">Live posts by type</h2>
          <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
            <div style="display: flex; flex-direction: column; gap: 5px">
              <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{t.label}}</span><b>{{t.value}}</b></div>
              <div style="height: 8px; border-radius: 4px; background: #EEEAF6"><div style="width: {{t.pct}}; height: 8px; border-radius: 4px; background: {{t.color}}"></div></div>
            </div>
          </sc-for>
        </div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800">Needs attention</h2>
          <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
            <a href="#" style="display: flex; gap: 10px; align-items: center; text-decoration: none; color: #1A1530; padding: 8px 0">
              <span style="width: 34px; height: 34px; border-radius: 10px; background: {{a.tint}}; color: {{a.ink}}; display: grid; place-items: center; flex: none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
              </span>
              <span style="font-size: 13px; font-weight: 600; flex: 1">{{a.text}}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const m = (label, icon, on, count) => ({ label, icon, bg: on ? 'rgba(255,255,255,.14)' : 'transparent', count: count || '' });
    return {
      menu: [
        m('Overview', 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z', true),
        m('Businesses', 'M4 9l1-5h14l1 5M4 9v11h16V9M4 9h16M9 20v-6h6v6', false, '12'),
        m('Posts & campaigns', 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z', false),
        m('Reports', 'M5 21V4M5 4h11l-2 4 2 4H5', false, '3'),
        m('Complaints', 'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6', false, '2'),
        m('Users', 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', false),
        m('Plans', 'M3 8l4 4 5-7 5 7 4-4-2 11H5z', false),
        m('Team & regions', 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', false),
      ],
      kpis: [
        { value: '18,420', label: 'Registered users', tint: '#ECE7FA', ink: '#3A1D8F', icon: 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
        { value: '612', label: 'Verified businesses', tint: '#E3F4EA', ink: '#0F6E3C', icon: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4' },
        { value: '1,284', label: 'Live posts', tint: '#FFF1E0', ink: '#8A4300', icon: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z' },
        { value: '9,730', label: 'Numbers shared (30 days)', tint: '#E9EEFF', ink: '#1E4BB8', icon: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2' },
        { value: '46', label: 'Camps this week', tint: '#E4F5F2', ink: '#0F6E5C', icon: 'M9 12l2 2 4-4M7 3h10v18H7z' },
        { value: '5', label: 'Open reports', tint: '#FDECEA', ink: '#B42318', icon: 'M5 21V4M5 4h11l-2 4 2 4H5' },
      ],
      queue: [
        { name: 'Annapurna Mess', meta: 'Food · Koramangala, Bengaluru · 2 h ago', flag: 'New in 48 h', tint: '#FFF1E0', ink: '#8A4300', icon: 'M4 11h16v9H4zM4 15h16M8 11V8M12 11V6M16 11V8' },
        { name: 'Dr. Meena Dental', meta: 'Doctors · Jayanagar, Bengaluru · 5 h ago', flag: '', tint: '#E4F5F2', ink: '#0F6E5C', icon: 'M8 3v5a4 4 0 0 0 8 0V3M12 12v3a4 4 0 0 0 8 0v-1' },
        { name: 'Sri Sai Travels', meta: 'Trips · Mysuru · yesterday', flag: 'Same phone as another business', tint: '#FCE9F2', ink: '#9C1F5A', icon: 'M5 16h14v-4l-2-5H7l-2 5zM5 12h14M7.5 16v2M16.5 16v2' },
        { name: 'Lakeview Banquet', meta: 'Halls · Hyderabad · yesterday', flag: '', tint: '#ECE7FA', ink: '#3A1D8F', icon: 'M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6' },
      ],
      types: [
        { label: 'Deals & offers', value: '742', pct: '78%', color: '#B35A00' },
        { label: 'Camps & campaigns', value: '188', pct: '22%', color: '#0F6E5C' },
        { label: 'Trips with seats', value: '131', pct: '16%', color: '#9C1F5A' },
        { label: 'Locals selling', value: '163', pct: '19%', color: '#3A1D8F' },
        { label: 'Events & announcements', value: '60', pct: '8%', color: '#1E4BB8' },
      ],
      alerts: [
        { text: 'Review reported as fake · Glow Salon', tint: '#FDECEA', ink: '#B42318', icon: 'M5 21V4M5 4h11l-2 4 2 4H5' },
        { text: 'Complaint LP7Q2K41 due in 6 h', tint: '#FFF1E0', ink: '#8A4300', icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2' },
        { text: '90% discount flagged · Quick Mobiles', tint: '#ECE7FA', ink: '#3A1D8F', icon: 'M19 5L5 19M7.5 8a1.5 1.5 0 1 0 0-.01M16.5 17a1.5 1.5 0 1 0 0-.01' },
      ],
    };
  }
}
</script>
</body>
</html>
